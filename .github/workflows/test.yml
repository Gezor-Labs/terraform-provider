name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v .
      - run: go vet ./...
      - name: Docs are up to date
        run: |
          go generate ./...
          git diff --compact-summary --exit-code -- docs || \
            (echo "Run 'go generate ./...' and commit the docs." && exit 1)

  test:
    name: Unit and fake-API tests (Terraform ${{ matrix.terraform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.*", "1.14.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go test -v -count=1 -timeout 10m ./...

  live:
    name: Live acceptance tests
    needs: test
    if: github.event_name == 'push' && vars.GEZOR_ENDPOINT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go test -v -count=1 -timeout 25m -run TestLive ./internal/provider/
        env:
          TF_ACC: "1"
          GEZOR_ENDPOINT: ${{ vars.GEZOR_ENDPOINT }}
          GEZOR_WORKSPACE: ${{ vars.GEZOR_WORKSPACE }}
          GEZOR_TEST_CLUSTER_ID: ${{ vars.GEZOR_TEST_CLUSTER_ID }}
          GEZOR_TOKEN: ${{ secrets.GEZOR_TOKEN }}
